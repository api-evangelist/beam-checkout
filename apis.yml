aid: beam-checkout
name: Beam Checkout
description: >-
  Beam is a Thailand-focused payments platform that lets businesses accept payments across in-person and
  online channels. Its products include Beam Checkout (online payments for social media, websites, and apps
  via hosted payment links and a Charges API), Beam Bolt (an in-person payment device), and Beam Bridge
  (embedded payments for partner platforms). Beam supports cards, e-wallets, QR PromptPay, installments,
  and Alipay+, with card authorization/capture, refunds, tokenization, 3DS, and CIT/MIT recurring flows.
  The v1 REST API uses HTTP Basic auth (merchantId:apiKey), idempotency keys, HMAC-signed webhooks, and a
  playground sandbox. Beam states it is PCI DSS compliant and compliant with Bank of Thailand regulations.
  Backed by Peak XV, Partech, and SeaX Ventures.
